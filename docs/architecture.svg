<rect class="dash" x="476" y="458" width="682" height="146" rx="8"/>
<text class="k" x="492" y="448">RENDERER ADAPTERS</text>
<rect class="chip-a" x="494" y="476" width="316" height="46" rx="6"/>
<text class="t-a" x="510" y="504">docxjs</text>
