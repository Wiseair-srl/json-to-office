<text class="t" x="581" y="240" text-anchor="middle">expand</text>
<text class="s" x="581" y="262" text-anchor="middle">custom → base components</text>
<rect class="card" x="712" y="200" width="210" height="90" rx="8"/>
<text class="t" x="817" y="236" text-anchor="middle">resolve</text>
<text class="s" x="817" y="258" text-anchor="middle">theme · fonts · layout</text>
<text class="s" x="817" y="276" text-anchor="middle">charts, visuals → images</text>
<rect class="card" x="948" y="200" width="210" height="90" rx="8"/>
<text class="t" x="1053" y="240" text-anchor="middle">compile</text>
<text class="s" x="1053" y="262" text-anchor="middle">lower to IR</text>
<path class="arr" marker-end="url(#a)" d="M450 245 L472 245"/>
<path class="arr" marker-end="url(#a)" d="M686 245 L708 245"/>
<path class="arr" marker-end="url(#a)" d="M922 245 L944 245"/>
<path class="arr" marker-end="url(#a)" d="M1053 290 L1053 336"/>

<rect class="ir" x="476" y="340" width="682" height="82" rx="8"/>
<text class="t-ir" x="500" y="374">DocxIR / PptxIR</text>
<text class="s-ir" x="500" y="398">plain data · explicit colours · named units · no backend types</text>

<path class="arr" marker-end="url(#a)" d="M472 381 L400 381 L400 466"/>
<rect class="card" x="240" y="470" width="210" height="90" rx="8"/>
<text class="t" x="345" y="510" text-anchor="middle">capability check</text>
<text class="s" x="345" y="532" text-anchor="middle">gap → error, no bytes</text>
