<!-- Source of truth for docs/architecture.png. After editing, regenerate the raster with:
     rsvg-convert -w 2160 docs/architecture.svg -o docs/architecture.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">json-to-office generation pipeline</title>
<desc id="desc">A JSON document, theme and plugin components are validated, expanded to base components, resolved, and compiled to a renderer-neutral intermediate representation. A capability check then hands the IR to one of four renderer adapters — docxjs or office-open for Word, pptxgenjs or office-open for PowerPoint — and a shared finalization pass emits a deterministic .docx or .pptx package.</desc>
<style>
  .bg{fill:#FFFFFF}
  .container{fill:#FAFAF8;stroke:#E0DFD8}
  .card{fill:#FFFFFF;stroke:#D3D1C7}
  .io{fill:#F1EFE8;stroke:#B4B2A9}
  .ir{fill:#EEEDFE;stroke:#7F77DD}
  .svc{fill:#FAEEDA;stroke:#BA7517}
  .chip-a{fill:#E1F5EE;stroke:#1D9E75}
  .chip-b{fill:#F1EFE8;stroke:#B4B2A9}
  .dash{fill:none;stroke:#C4C2B8;stroke-dasharray:5 5}
  .h{fill:#2C2C2A;font-size:17px;font-weight:500}
  .t{fill:#2C2C2A;font-size:15px;font-weight:500}
  .s{fill:#5F5E5A;font-size:12.5px}
  .k{fill:#5F5E5A;font-size:12px;letter-spacing:.06em}
  .t-ir{fill:#3C3489;font-size:15px;font-weight:500}
  .s-ir{fill:#534AB7;font-size:12.5px}
  .t-svc{fill:#854F0B;font-size:13.5px;font-weight:500}
  .t-a{fill:#0F6E56;font-size:14px;font-weight:500}
  .s-a{fill:#0F6E56;font-size:12px}
  .t-b{fill:#444441;font-size:14px;font-weight:500}
  .s-b{fill:#5F5E5A;font-size:12px}
  .arr{fill:none;stroke:#888780;stroke-width:1.4}
  .head{fill:#888780}
  rect{stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1A1A18}
    .container{fill:#222220;stroke:#3B3B37}
    .card{fill:#2B2B29;stroke:#4A4A45}
    .io{fill:#2C2C2A;stroke:#5F5E5A}
    .ir{fill:#26215C;stroke:#7F77DD}
    .svc{fill:#412402;stroke:#BA7517}
    .chip-a{fill:#04342C;stroke:#1D9E75}
    .chip-b{fill:#2C2C2A;stroke:#888780}
    .dash{stroke:#5F5E5A}
    .h,.t{fill:#F1EFE8}
    .s,.k{fill:#B4B2A9}
    .t-ir{fill:#CECBF6}
    .s-ir{fill:#AFA9EC}
    .t-svc{fill:#FAC775}
    .t-a,.s-a{fill:#9FE1CB}
    .t-b{fill:#D3D1C7}
    .s-b{fill:#B4B2A9}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="head" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1440" height="740"/>

<text class="k" x="712" y="28">INJECTED SERVICES — NEVER BUNDLED</text>
