<text class="t" x="102" y="343" text-anchor="middle">plugin</text>
<text class="t" x="102" y="360" text-anchor="middle">components</text>

<rect class="container" x="212" y="120" width="988" height="580" rx="12"/>
<text class="h" x="236" y="152">json-to-office</text>
