<text class="t-svc" x="1044" y="71" text-anchor="middle">PPTX rasterizer (LibreOffice)</text>

<rect class="dash" x="14" y="180" width="176" height="212" rx="8"/>
<text class="k" x="24" y="170">INPUTS</text>
<rect class="io" x="28" y="196" width="148" height="48" rx="6"/>
<text class="t" x="102" y="225" text-anchor="middle">document JSON</text>
<rect class="io" x="28" y="258" width="148" height="48" rx="6"/>
<text class="t" x="102" y="287" text-anchor="middle">theme JSON</text>
