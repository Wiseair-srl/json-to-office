<text class="s-b" x="1124" y="504" text-anchor="end">docx · experimental</text>
<rect class="chip-a" x="494" y="536" width="316" height="46" rx="6"/>
<text class="t-a" x="510" y="564">pptxgenjs</text>
<text class="s-a" x="794" y="564" text-anchor="end">pptx · default</text>
<rect class="chip-b" x="824" y="536" width="316" height="46" rx="6"/>
