services:
  # Combined render server: Highcharts Export Server (charts) + pptx rasterizer
  # (docx `visual` components). Serves /export and /rasterize from one instance.
  # NOTE: renamed from `highcharts-export-server` — Render assigns a new
  # *.onrender.com URL on first deploy of the renamed service. Confirm the
  # actual URL in the dashboard and update the two URLs below if it differs.
  - type: web
    name: jto-render-server
    runtime: docker
    plan: standard
    dockerfilePath: ./services/jto-render-server/Dockerfile
    envVars:
      - key: RENDER_AUTH_MODE
        value: required
      # Set a strong secret in Render. The three caller keys below must use
      # this same value; Blueprint secret fields intentionally do not commit it.
      - key: RENDER_API_KEY
        sync: false
      # NODE_ENV=production selects OUTBOUND_SOURCE_MODE=safe, where an empty
      # allowlist refuses every remote host. /rasterize receives full document
      # JSON, so the hosts used by the bundled playground templates must be
      # listed here too.
      - key: OUTBOUND_HOST_ALLOWLIST
        value: ik.imagekit.io,placehold.co
      # One docx render fans out into one /rasterize call per `visual`
      # component; bundled templates carry ~25 each, so the 30/15min
      # production default starved a single document. Callers are the
      # authenticated playgrounds (RENDER_AUTH_MODE=required), so a generous
      # ceiling is safe; the same applies to chart-heavy docs on /export.
      - key: RASTERIZE_RATE_LIMIT
        value: '600'
      - key: EXPORT_RATE_LIMIT
        value: '600'
    healthCheckPath: /health

  - type: web
    name: jto-playground-docx
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FORMAT
        value: docx
      # VITE_AI_ENABLED only hides the client UI; AI_ENABLED is what keeps the
      # server from mounting /api/ai, which would be unauthenticated here.
      - key: VITE_AI_ENABLED
        value: 'false'
      - key: AI_ENABLED
        value: 'false'
      # These hosted playgrounds are intentionally public browser demos. A
      # browser cannot keep API_KEY secret; private deployments should remove
      # this override, use API_AUTH_MODE=required, and set API_KEY behind an
      # authenticated gateway.
      - key: API_AUTH_MODE
        value: disabled
      # Both chart export and visual rasterization are served by jto-render-server.
      - key: HIGHCHARTS_SERVER_URL
        value: https://jto-render-server.onrender.com
      - key: HIGHCHARTS_API_KEY
        sync: false
      - key: JTO_PPTX_RASTERIZER_URL
        value: https://jto-render-server.onrender.com
      - key: JTO_PPTX_RASTERIZER_API_KEY
        sync: false
      # Hosts referenced by the bundled templates and demo documents. In safe
      # mode (the production default) an empty allowlist blocks every remote
      # image, which fails the playground's own examples.
      - key: OUTBOUND_HOST_ALLOWLIST
        value: ik.imagekit.io,placehold.co
      # The image ships the example plugins, and the rail lists them. Without
      # this the server refuses to load them (the production default, since a
      # public deployment has no key for the authenticated load route), so
      # `weather` completed and validated locally and came back "Unknown
      # component" here. Only this image's own filesystem is read, once, at
      # boot.
      - key: PLUGIN_AUTOLOAD
        value: 'true'
    healthCheckPath: /health

  - type: web
    name: jto-playground-pptx
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FORMAT
        value: pptx
      # See the DOCX service comment above: both flags are required.
      - key: VITE_AI_ENABLED
        value: 'false'
      - key: AI_ENABLED
        value: 'false'
      # Intentionally public demo; see the DOCX service comment above.
      - key: API_AUTH_MODE
        value: disabled
      - key: HIGHCHARTS_SERVER_URL
        value: https://jto-render-server.onrender.com
      - key: HIGHCHARTS_API_KEY
        sync: false
      - key: JTO_PPTX_RASTERIZER_URL
        value: https://jto-render-server.onrender.com
      - key: JTO_PPTX_RASTERIZER_API_KEY
        sync: false
      # See the DOCX service comment above.
      - key: OUTBOUND_HOST_ALLOWLIST
        value: ik.imagekit.io,placehold.co
      # See the DOCX service comment above.
      - key: PLUGIN_AUTOLOAD
        value: 'true'
    healthCheckPath: /health
