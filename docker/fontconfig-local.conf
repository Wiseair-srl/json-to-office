<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- SAFE_FONTS with no free metric-compatible clone in Debian. Debian's own
       /etc/fonts/conf.d/30-metric-aliases.conf already handles Arial, Calibri,
       Cambria, Courier New, Times New Roman and Helvetica; these are the rest.
       <accept> appends a fallback rather than overriding, so a genuinely
       installed or per-conversion staged face of the same name still wins. -->
  <alias binding="same"><family>Segoe UI</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Trebuchet MS</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Georgia</family><accept><family>DejaVu Serif</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Menlo</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Monaco</family><accept><family>DejaVu Sans Mono</family></accept></alias>
</fontconfig>
