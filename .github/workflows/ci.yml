name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch's in-flight run is what keeps PR feedback current, but
  # main is where `release` publishes: two pushes in quick succession would
  # cancel the first one, and there is a window inside `changesets/action`
  # between pushing the git tag and finishing `npm publish` where a cancel
  # leaves the two out of step. Main runs to completion; every other ref keeps
  # the old behaviour.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Read-only by default, so a compromised dependency pulled in by `quality`,
# `test` or `conformance` cannot use GITHUB_TOKEN to write. `release` declares
# the scopes it needs itself, and a job-level block overrides this one.
permissions:
  contents: read

jobs:
  # Every release costs three CI runs: the PR, the merge that opens
  # `changeset-release/main`, and the merge of that PR. The third one tests a
  # tree whose source is byte-identical to the second's — changesets only
  # rewrites `"version"`, drops the consumed `.changeset/*.md` and appends to
  # CHANGELOGs (deps here are `workspace:^`, so it never touches a dependency
  # range). Skipping it on that basis would be an assumption; this job turns it
  # into a check. It classifies the push by what actually moved and refuses to
  # claim `version-only` for anything it cannot account for — an unreadable
  # base, an empty diff, a `package.json` line that is not a version bump — so
  # every uncertain case falls back to the full pipeline.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version-only: ${{ steps.scope.outputs.version-only }}
      test-matrix: ${{ steps.scope.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The push's `before` commit is not an ancestor of anything shallow.
          fetch-depth: 0

      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-}"
          version_only=false

          if [ "$EVENT_NAME" = 'push' ] \
            && [ -n "$base" ] \
            && [ "$base" != '0000000000000000000000000000000000000000' ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then

            changed="$(git diff --name-only "$base" "$HEAD_SHA")"

            # An empty diff is not a licence to run less; it is a shape nobody
            # designed for, so it takes the full pipeline like anything else.
            if [ -n "$changed" ]; then
              version_only=true
              while IFS= read -r file; do
                case "$file" in
                  .changeset/*.md | CHANGELOG.md | */CHANGELOG.md)
                    continue
                    ;;
                  package.json | */package.json)
                    # A manifest may move, but only its version line. This is
                    # what stops a dependency bump — which is a code change in
                    # every sense that matters — from riding in as a version
                    # bump and taking the reduced pipeline with it.
                    if git diff -U0 "$base" "$HEAD_SHA" -- "$file" \
                      | grep -E '^[+-]' \
                      | grep -vE '^(\+\+\+|---)' \
                      | grep -qvE '^[+-][[:space:]]*"version": "[^"]+",?$'; then
                      version_only=false
                      break
                    fi
                    ;;
                  *)
                    version_only=false
                    break
                    ;;
                esac
              done <<< "$changed"
            fi
          fi

          # The advertised range is `>=20` and `test` proves it end to end, but
          # it does not have to prove it on every intermediate commit. A PR
          # carries both ends of the range plus the one OS that has ever failed
          # differently (see the concurrency note in `test`); a version-only
          # push carries a single leg, because the eight-leg proof for this
          # exact source tree is the run that just published the version PR.
          # Anything else — every merge to main included — gets all eight, so
          # what stands in front of `npm publish` is unchanged.
          full="$(jq -cn '{
            include: [
              ["ubuntu-latest", "windows-latest"][] as $os
              | [20, 22, 24, 26][] as $node
              | {os: $os, "node-version": $node}
            ]
          }')"

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            matrix='{"include":[{"os":"ubuntu-latest","node-version":20},{"os":"ubuntu-latest","node-version":26},{"os":"windows-latest","node-version":20}]}'
          elif [ "$version_only" = true ]; then
            matrix='{"include":[{"os":"ubuntu-latest","node-version":20}]}'
          else
            matrix="$full"
          fi

          echo "version-only=$version_only" >> "$GITHUB_OUTPUT"
          echo "test-matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Classified as version-only=$version_only; test matrix: $matrix"

  quality:
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `build` is content-addressed by turbo (see `inputs` in turbo.json), and
      # ten packages of it run in front of `test`, `preview` and `conformance`
      # alike. Restoring the cache is sound for the same reason an incremental
      # local build is: the key is the hash of the inputs, not the branch or
      # the clock. The node version is in the cache key even though turbo does
      # not hash it — reusing a tree built on another runtime is exactly the
      # class of difference the matrix exists to catch, and it is not worth
      # laundering it through a cache hit.
      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node20-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node20-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm check:renderer-docs

      - run: pnpm typecheck

      - run: pnpm docs:build

  test:
    needs: guard
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    strategy:
      # Both ends of the advertised `>=20` range, not just the old end. The
      # corpus goldens are this pipeline's proof that output has not changed,
      # and they used to hash raw package bytes — which include the runtime's
      # deflate output, so a runtime whose zlib differs fails every case at
      # once while changing nothing about any document. The goldens cover part
      # content instead now (#264); these entries are what keeps that claim
      # exercised rather than asserted. Which legs run is decided by `guard`
      # above; a merge to main always runs the full eight.
      matrix: ${{ fromJSON(needs.guard.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Turbo runs ten packages at once by default and vitest forks per core
      # inside each, which on a four-core Windows runner oversubscribes the
      # box badly enough to read as product failures. Two shapes of it, on
      # consecutive commits: run 33621956828 gave up on an mcp-server stdio
      # response after 60s, and 33623795402 lost three `onTaskUpdate` RPCs in
      # core-docx — birpc's own 60s ceiling — after all 1,995 of its tests had
      # passed. Neither suite was at fault, and per-case timeouts only move
      # the next failure somewhere else. Serial costs this job wall-clock and
      # buys back a machine that can answer. Ubuntu keeps the default; it has
      # never gone red this way.
      - run: pnpm test
        if: matrix.os != 'windows-latest'

      - run: pnpm test -- --concurrency=1
        if: matrix.os == 'windows-latest'

  # The suites that need a real LibreOffice and poppler skip themselves when
  # the binaries are absent, so a cold checkout stays green — which also meant
  # they never ran anywhere, `test` above included. That silently retired the
  # MCP preview pipeline's whole end-to-end proof (#205), the cache reuse
  # assertions among it, plus both cores' libreoffice-smoke suites. One leg,
  # one OS: `JTO_REQUIRE_LIBREOFFICE=1` turns the skip into a failure, so a
  # missing install fails loudly here instead of quietly passing everywhere.
  #
  # This is the one job a version-only push skips. It installs an apt tree and
  # drives a real converter to prove things about rendering code, and on such a
  # push there is no rendering code that the previous run did not already see.
  preview:
    needs: guard
    if: >-
      (github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main')
      && needs.guard.outputs.version-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Writer and Impress rather than the `libreoffice` metapackage: they pull
      # the same soffice binary and both export filters the pipeline asks for,
      # without Base, Draw, Math and their dependency trees.
      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-impress poppler-utils
          soffice --version
          # Some poppler builds print the version to stderr and exit non-zero
          # for `-v`, so presence on PATH is the check and the banner is only
          # for the log. What actually gates the job is the step below.
          command -v pdftoppm
          pdftoppm -v || true

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node20-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node20-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run the converter-dependent suites
        env:
          JTO_REQUIRE_LIBREOFFICE: '1'
        run: >-
          pnpm --filter @json-to-office/mcp-server
          --filter @json-to-office/core-docx
          --filter @json-to-office/core-pptx test

  conformance:
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node20-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node20-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Generate JSON and TypeBox schemas
        shell: bash
        run: |
          node packages/jto-cli/dist/cli.js docx schemas --document-only --output-dir .schema-smoke/docx
          node packages/jto-cli/dist/cli.js pptx schemas --document-only --output-dir .schema-smoke/pptx
          node packages/jto-cli/dist/cli.js docx schemas --document-only --format typebox --output-dir .schema-smoke/typebox-docx
          node packages/jto-cli/dist/cli.js pptx schemas --document-only --format typebox --output-dir .schema-smoke/typebox-pptx
          test -s .schema-smoke/docx/document.schema.json
          test -s .schema-smoke/pptx/presentation.schema.json
          test -s .schema-smoke/typebox-docx/document.schema.ts
          test -s .schema-smoke/typebox-pptx/presentation.schema.ts
          if grep -R 'Type\.Any' .schema-smoke/typebox-*; then
            echo 'TypeBox export contains a Type.Any placeholder' >&2
            exit 1
          fi

      - name: Validate all examples
        shell: bash
        run: |
          for file in examples/*.docx.json; do
            node packages/jto-cli/dist/cli.js docx validate "$file" --strict --quiet
          done
          for file in examples/*.pptx.json; do
            node packages/jto-cli/dist/cli.js pptx validate "$file" --strict --quiet
          done

      - name: Validate shipped assets and docs samples
        shell: bash
        run: pnpm validate:assets

      - name: Check generated schemas against smoke examples and stock templates
        shell: bash
        run: |
          node packages/jto-cli/dist/cli.js docx validate examples/invoice.docx.json --quiet --schema .schema-smoke/docx/document.schema.json
          node packages/jto-cli/dist/cli.js pptx validate examples/quarterly-review.pptx.json --quiet --schema .schema-smoke/pptx/presentation.schema.json
          # The only shipped example on the second backend, and the only one
          # using a renderer-gated prop (`visual.renderMode`). It is what proves
          # the exported schema's `renderer` branch offers what the runtime
          # accepts, rather than only the default branch.
          node packages/jto-cli/dist/cli.js docx validate examples/native-visual.docx.json --quiet --schema .schema-smoke/docx/document.schema.json
          # The two examples above write `props` on every node, so they never
          # exercised the exported schema's optionality. The stock templates do:
          # tech-report has 23 propless `section` nodes that the runtime accepts
          # and the exported schema rejected, and nothing in CI could see it —
          # `validate:assets` above uses the runtime validator, which reaches the
          # same verdict by a different path. These are the documents the
          # playground actually opens, so they gate the schema editors consume.
          for file in packages/jto/src/client/public/templates/*.docx.json; do
            node packages/jto-cli/dist/cli.js docx validate "$file" --quiet --schema .schema-smoke/docx/document.schema.json
          done
          for file in packages/jto/src/client/public/templates/*.pptx.json; do
            node packages/jto-cli/dist/cli.js pptx validate "$file" --quiet --schema .schema-smoke/pptx/presentation.schema.json
          done

      - name: Render dependency-free smoke examples
        shell: bash
        run: |
          node packages/jto-cli/dist/cli.js docx generate examples/invoice.docx.json --output "$RUNNER_TEMP/invoice.docx" --no-google-fonts
          node packages/jto-cli/dist/cli.js pptx generate examples/quarterly-review.pptx.json --output "$RUNNER_TEMP/quarterly-review.pptx" --no-google-fonts
          # A `visual` normally needs LibreOffice; this one is drawn natively,
          # so it belongs in the dependency-free set and is the smoke test that
          # a drawing group survives the whole CLI path.
          node packages/jto-cli/dist/cli.js docx generate examples/native-visual.docx.json --output "$RUNNER_TEMP/native-visual.docx" --no-google-fonts
          test -s "$RUNNER_TEMP/invoice.docx"
          test -s "$RUNNER_TEMP/quarterly-review.pptx"
          test -s "$RUNNER_TEMP/native-visual.docx"

  release:
    needs: [quality, test, preview, conformance]
    # `preview` skips itself on a version-only push, and a skipped need would
    # otherwise skip this job with it — so the gates are named one by one
    # instead of inherited. Three of them must be green; only `preview` may be
    # absent, and only in the case `guard` proved. `!cancelled()` is what gets
    # this expression evaluated at all once a need has skipped.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.quality.result == 'success'
      && needs.test.result == 'success'
      && needs.conformance.result == 'success'
      && (needs.preview.result == 'success' || needs.preview.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
